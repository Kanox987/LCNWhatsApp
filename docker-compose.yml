# Compose do LCNWhatsApp. Funciona com Docker e com Podman (podman compose).
# Subir:   docker compose up -d --build
# Logs/QR: docker compose logs -f
# Painel:  lcn      (ou: docker compose exec lcnwhatsapp node src/dashboard.js)
#
# Dockerfile, limites de recurso (memory/cpus) e o volume de modelos vêm do
# docker-compose.override.yml — gerado automaticamente por install.sh/
# update.sh a partir das suas respostas (perfil de recursos + transcrição
# local), sempre com as MESMAS escolhas usadas pelo run.sh. Não edite esse
# override à mão; rode o instalador/atualizador de novo pra mudar.
services:
  lcnwhatsapp:
    container_name: LCNWhatsApp
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stdin_open: true                  # permite login por QR/código nos logs
    tty: true
    environment:
      # Caminho (dentro do container) do perfil a aplicar na primeira subida.
      # Vazio = instância limpa. Ex.: /run/lcn/provisioning/perfis/recuperar-x9.json
      LCN_PROVISION_PROFILE: ${LCN_PROVISION_PROFILE:-}
    volumes:
      - ./sessao:/app/sessao
      - ./midia:/app/midia
      - ./data:/app/data
      - ./config.json:/app/config.json
      # Perfis de provisionamento (o que a instância já nasce tendo). A pasta
      # existe no repositório, então o mount nunca cria diretório no host.
      - ./deployment:/run/lcn/provisioning:ro
